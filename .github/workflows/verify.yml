name: Verify reader
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    # The pinned runner family includes Node 22+ and Chrome; keep browser QA dependency-free.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/build.py
      - run: python3 -m unittest discover -s tests -v
      - name: Verify browser reading flows
        run: node tests/frontend_browser.mjs
